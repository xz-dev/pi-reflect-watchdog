name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-reflect-watchdog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V
      - run: npm ci
      - name: Assert Pi fixture matches the manifest
        run: |
          expected="$(node -p 'require("./package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          test "$(./node_modules/.bin/pi --version)" = "$expected"
      - run: npm run check
      - name: Stock Pi package and Git-install E2E
        run: npm run test:e2e
